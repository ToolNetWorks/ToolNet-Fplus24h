{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | ToolNet Publisher>
    </title>
    <link rel="stylesheet" href="{% static 'adminpanel/login.css' %}">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <span class="brand-logo">T</span>
                <div>
                    <strong>TOOLNET</strong>
                    <span>PUBLISHER</span>
                </div>
            </div>

            <div class="heading">
                <h1>Đăng nhập quản trị</h1>
                <p>Đăng nhập để quản lý Pipeline và cộng tác viên.</p>
            </div>

            {% if form.errors %}
            <div class="alert" role="alert">
                Tài khoản, mật khẩu hoặc quyền truy cập không hợp lệ.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <label for="id_username">Tên đăng nhập</label>
                <input
                    type="text"
                    id="id_username"
                    name="username"
                    autocomplete="username"
                    maxlength="150"
                    required
                    autofocus
                    placeholder="Nhập tên đăng nhập"
                >

                <label for="id_password">Mật khẩu</label>
                <input
                    type="password"
                    id="id_password"
                    name="password"
                    autocomplete="current-password"
                    required
                    placeholder="Nhập mật khẩu"
                >

                <button type="submit">
                    Đăng nhập
                </button>
            </form>

            <div class="footer">
                ToolNet Publisher · Admin Control Center
            </div>
        </section>
    </main>
</body>
</html>
